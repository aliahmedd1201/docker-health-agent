server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not reveal the nginx version in responses
    server_tokens off;

    # Health check for Docker and the load balancer
    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # Forward API calls to the backend container
    location /api/ {
        # Docker's internal DNS, re-resolved every 10s
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Built assets have hashed names, so cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}