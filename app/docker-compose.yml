# Frontend (Nginx) + backend (Node) stack for local and EC2
services:
  backend:
    build: ./backend
    image: backend:local
    container_name: backend
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in app/.env}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    image: frontend:local
    container_name: frontend
    ports:
      - "8081:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging